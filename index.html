<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Absensi Online</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Absen Kehadiran</h2>
    <form id="attendanceForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" required placeholder="Masukkan nama Anda">
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" required>
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
            </select>
        </div>
        <div class="form-group">
            <label for="keterangan">Keterangan (Opsional)</label>
            <textarea id="keterangan" rows="3" placeholder="Alasan izin/sakit jika ada"></textarea>
        </div>
        <button type="submit" id="submitBtn">Kirim Absen</button>
    </form>
    <div id="message"></div>
</div>

<script>
    // GANTI TAUTAN DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby6vlJvLcVdJPzP0kri1SAu-5zPBgoFYE70I-YqkTNWbv9rd653jXd0kwMTq28f2fSN/exec";

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Mengirim...";
        messageDiv.innerText = "";

        const formData = {
            nama: document.getElementById('nama').value,
            status: document.getElementById('status').value,
            keterangan: document.getElementById('keterangan').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Penting untuk menghindari CORS issue pada Google Apps Script sederhana
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            messageDiv.style.color = "green";
            messageDiv.innerText = "Absen berhasil dikirim!";
            document.getElementById('attendanceForm').reset();
        })
        .catch(error => {
            messageDiv.style.color = "red";
            messageDiv.innerText = "Gagal mengirim absen.";
            console.error('Error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Kirim Absen";
        });
    });
</script>

</body>
</html>
